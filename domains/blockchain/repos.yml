# domains/blockchain/repos.yml — consensus-critical node software.
#
# Scope rule: a repository belongs here when a defect in it can halt a chain,
# split it, or let an invalid state be accepted as valid. That is the node's
# own threat model — not the application's — so smart contracts deployed ON a
# chain belong in domains/smartcontract, and key-custody software belongs in
# domains/wallet.
#
# The eleven Ethereum clients (five execution-layer, six consensus-layer) are
# tier 1 and were migrated from NyxFoundation/ethereum-vuln-dataset. They are
# the most interesting rows in this domain for a specific reason: the same
# specification is implemented eleven times, so a defect in one is a natural
# experiment about whether the other ten got it right.
#
# Extra fields carried for this domain:
#   layer      execution | consensus | full | infra
#   ecosystem  the chain family the software serves

domain: blockchain
description: >-
  Node implementations and consensus-critical infrastructure, where a defect
  can halt a chain, split it, or admit an invalid state transition.

defaults:
  forge: github.com

repos:
  # ---- Ethereum execution layer ------------------------------------------
  geth:
    repo: ethereum/go-ethereum
    category: client
    tier: 1
    language: go
    layer: execution
    ecosystem: ethereum
