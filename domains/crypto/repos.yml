# domains/crypto/repos.yml — cryptographic implementations.
#
# Scope rule: a repository belongs here when it implements a cryptographic
# primitive or protocol, and a defect in it breaks a security guarantee rather
# than merely crashing. This is the domain where the most valuable bug fixes
# are the quietest: a constant-time regression, a missing subgroup check, a
# nonce derived from the wrong input. None of those read as security fixes in
# a commit message, which is the entire argument for walking whole histories
# instead of grepping for "security".
#
# Extra field carried for this domain:
#   primitive  tls | hash | signature | curve | aead | pq | zk | mpc | rng

domain: crypto
description: >-
  Cryptographic libraries and protocol implementations, where a defect breaks a
  security guarantee rather than merely crashing — the domain where silent
  fixes are the norm rather than the exception.

defaults:
  forge: github.com

