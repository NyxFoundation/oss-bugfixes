# domains/smartcontract/repos.yml — on-chain application code.
#
# Scope rule: a repository belongs here when its code is DEPLOYED to a chain
# and a defect in it puts value held by that deployment at risk. Node software
# belongs in domains/blockchain; key custody belongs in domains/wallet.
#
# Four execution environments, because "smart contract" is not one language:
#
#   evm       Solidity and Vyper. The largest body of deployed value and of
#             published audit history.
#   solana    Rust programs. A different failure surface entirely — account
#             validation, PDA derivation, CPI reentrancy — which is why it is
#             listed rather than assumed to behave like the EVM.
#   aptos/sui Move. Resource semantics make whole EVM bug classes
#             unrepresentable and introduce their own around capabilities and
#             object ownership.
#   starknet  Cairo. Small but the proving model makes its arithmetic bugs
#             distinct.
#
# Two kinds of entry, mixed on purpose:
#   * the widely-FORKED libraries (OpenZeppelin, Solady, SPL, Metaplex, the
#     Sui and Aptos frameworks). A defect in one is a defect in every protocol
#     that inherited it, which makes their fix history disproportionately
#     valuable.
#   * the large protocol DEPLOYMENTS. These carry the fixes that happened
#     AFTER an audit, which is exactly the population an audit tool should be
#     scored against.
#
# Archived repositories are kept. A history that will not grow is still
# evidence, and several of these — Balancer v2, Compound v2, Drift v2 — hold
# more deployed value than active successors.
#
# Every entry here was checked against the forge when it was added. Check them
# again with `oss-bugfixes audit --domain smartcontract`: the first such audit
# found one deleted repository and four that had moved organisation, out of
# forty.
#
# Extra field carried for this domain:
#   ecosystem  evm | solana | aptos | sui | starknet | multi

domain: smartcontract
description: >-
  Deployed on-chain application code and the contract libraries it inherits
  from, across EVM, Solana, Move and Cairo, where a defect puts value held by
  the deployment at risk.

defaults:
  forge: github.com

