# domains/smartcontract/repos.yml — on-chain application code.
#
# Scope rule: a repository belongs here when its code is DEPLOYED to a chain
# and a defect in it puts value held by that deployment at risk. Node software
# belongs in domains/blockchain; key custody belongs in domains/wallet.
#
# Two kinds of entry, deliberately mixed:
#   * the widely-forked LIBRARIES (OpenZeppelin, Solady, Solmate). A defect in
#     one of these is a defect in every protocol that inherited it, which is
#     what makes their fix history disproportionately valuable.
#   * the large protocol DEPLOYMENTS. These carry the fixes that happened after
#     an audit, which is exactly the population an audit tool should be scored
#     against.
#
# This domain also holds the audit-findings corpus in data/, which is a
# different kind of evidence: an expert's written judgement rather than a
# commit. The two are kept side by side on purpose — a finding says what an
# auditor caught, a commit says what shipped.

domain: smartcontract
description: >-
  Deployed on-chain application code and the contract libraries it inherits
  from, where a defect puts value held by the deployment at risk.

defaults:
  forge: github.com

repos:
  # ---- contract libraries (a defect here is inherited by thousands) -------
