# domains/wallet/repos.yml — the wallet registry.
#
# Scope rule: a repository belongs here when a defect in it can lead to loss of
# user funds, key material, or signing authority. That is deliberately wider
# than "a wallet app" — it covers the hardware firmware that holds the seed,
# the smart-contract account that holds the balance, the MPC/TSS library that
# shards the key, and the signing/transport libraries every wallet UI is built
# on. Historically those libraries are where the severe, cross-wallet bugs
# live: one bug in bitcoinjs-lib or noble-curves is simultaneously a bug in a
# hundred wallets.
#
# Closed-source wallets are absent BY CONSTRUCTION, not by oversight — Phantom,
# Exodus, OKX, Bitget, SafePal, Coinomi, Atomic and the exchange custodians
# publish no commit history, so no silent fix of theirs is observable. See
# docs/limitations.md.
#
# Fields beyond the framework's own (`custody`, `ecosystem`) are carried
# through untouched and are available to this domain's analysis.
#   custody: self (user holds the key) | hw (secure element) | mpc (sharded)
#            | smart (contract-defined authority) | lib (holds no key itself)
#
# Migrated from NyxFoundation/wallet-vuln-dataset collection/wallets.py.

domain: wallet
description: >-
  Repositories where a defect can cost a user their funds, keys or signing
  authority: wallet applications, hardware firmware, smart accounts, MPC/TSS
  libraries, and the signing and transport libraries wallets are built on.

defaults:
  forge: github.com

