name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # A venv, not --system: the runner's Python is externally managed and
      # refuses a system install.
      - name: Install
        run: |
          uv venv
          uv pip install -e ".[dev]"

      # The registries are the coverage claim, so a malformed one is a build
      # failure rather than something you find out about mid-sweep.
      - name: Validate every registry
        run: uv run oss-bugfixes validate

      # Offline: the fixtures build real git repositories in a tmpdir, so the
      # walk, diff and sink stages run against actual git behaviour.
      # The classifier's decision rules are not conventions: their domain is
      # finite, so they are discharged over all 8,192 inputs by Z3, by
      # executing the real function, and by checking the two agree.
      - name: Verify the verdict rules
        run: uv run python -m ossbugfix.detect.verify

      - name: Type-check the decision core
        run: uv run python -m mypy --strict ossbugfix/detect/

      - name: Tests
        run: uv run python -m pytest -q

      # Proves the whole chain end to end without a network or an API key.
      - name: Smoke the pipeline on a local repository
        run: |
          uv run python - <<'PY'
          import subprocess, tempfile, os, pathlib, sys
          tmp = pathlib.Path(tempfile.mkdtemp())
          src = tmp / "src"; src.mkdir()
          env = {**os.environ, "GIT_AUTHOR_NAME": "ci", "GIT_AUTHOR_EMAIL": "ci@x",
                 "GIT_COMMITTER_NAME": "ci", "GIT_COMMITTER_EMAIL": "ci@x"}
          def git(*a, cwd=src): subprocess.run(["git", "-C", str(cwd), *a], check=True, env=env, capture_output=True)
          git("init", "-q", "-b", "main")
          (src / "a.c").write_text("int main(){return 0;}\n")
          git("add", "-A"); git("commit", "-qm", "initial")
          (src / "a.c").write_text("int main(){/*bounds*/return 0;}\n")
          git("add", "-A"); git("commit", "-qm", "fix out-of-bounds read. CVE-2024-0001")

          root = tmp / "root"; (root / "domains" / "ci").mkdir(parents=True)
          (root / "domains" / "ci" / "repos.yml").write_text(
              "domain: ci\ndescription: smoke\nrepos:\n  sample:\n    repo: example/sample\n")
          env2 = {**env, "OSS_BUGFIXES_ROOT": str(root), "OSS_BUGFIXES_WORK": str(tmp / "work")}

          from ossbugfix import mirror, registry
          os.environ.update({k: env2[k] for k in ("OSS_BUGFIXES_ROOT", "OSS_BUGFIXES_WORK")})
          repo = registry.load("ci").get("sample")
          dest = mirror.mirror_path(repo); dest.parent.mkdir(parents=True, exist_ok=True)
          subprocess.run(["git", "clone", "--bare", "-q", str(src), str(dest)], check=True)

          for stage in ("walk", "signals", "diffs", "classify"):
              rc = subprocess.run([sys.executable, "-m", "ossbugfix.cli", stage,
                                   "--domain", "ci"] + (["--engine", "heuristic"] if stage == "classify" else []),
                                  env=env2).returncode
              assert rc == 0, f"{stage} exited {rc}"

          import pandas as pd
          df = pd.read_csv(root / "domains" / "ci" / "data" / "bugfixes.csv")
          assert len(df) == 2, df
          fix = df[df.subject.str.startswith("fix out-of-bounds")].iloc[0]
          assert fix.advisory_ids == "CVE-2024-0001", fix.advisory_ids
          assert fix.is_security_fix == True, fix.is_security_fix
          print("smoke ok:", len(df), "rows")
          PY

  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The package has no mathlib and no package-index dependency, so a bare
      # toolchain is the whole environment.
      - name: Install Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # Building the library checks the proofs in OssBugfix/Props.lean. A
      # detector that breaks one of the honesty theorems fails here.
      - name: Build (this checks the proofs)
        working-directory: lean
        run: lake build

      - name: No sorry in the package
        working-directory: lean
        run: |
          if grep -rn --include='*.lean' -E '\bsorry\b|\badmit\b' OssBugfix Main.lean; then
            echo "::error::a proof was admitted rather than proved"; exit 1
          fi

      # Two fixed patches: a guard inserted into existing code must come back a
      # security fix, a comment-only edit must come back refuted.
      - name: Selftest
        working-directory: lean
        run: ./.lake/build/bin/ossbugfix-classify --selftest

      # The parity test is skipped in the `test` job because the binary does
      # not exist there. Here it does, so drift between the two engines is
      # actually caught rather than silently skipped in both jobs.
      - name: Install Python side
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: The two engines must agree
        run: |
          uv venv
          uv pip install -e ".[dev]"
          uv run python -m pytest tests/test_engine_parity.py -q

      - name: Theorems depend on no extra axioms
        working-directory: lean
        run: |
          cat > /tmp/ax.lean <<'EOF'
          import OssBugfix
          #print axioms OssBugfix.security_needs_witness
          #print axioms OssBugfix.refuted_is_silent
          #print axioms OssBugfix.signatures_monotone
          EOF
          out=$(LEAN_PATH=.lake/build/lib/lean lean /tmp/ax.lean)
          echo "$out"
          if echo "$out" | grep -qv 'propext\|Classical.choice\|Quot.sound'; then
            echo "::notice::axiom list printed above"
          fi
          echo "$out" | grep -q 'sorryAx' && { echo "::error::sorryAx reached a theorem"; exit 1; } || true
