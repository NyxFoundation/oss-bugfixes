[project]
name = "oss-bugfixes"
version = "0.1.0"
description = "A uniform harness for mining bug-fix commits out of open-source repositories, across security domains"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16",
    "PyYAML>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "mypy>=1.10", "z3-solver>=4.13"]

[project.scripts]
oss-bugfixes = "ossbugfix.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ossbugfix"]

[tool.pytest.ini_options]
testpaths = ["tests"]
